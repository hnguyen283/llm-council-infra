name: infrastructure-standardization

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci-contract:
    runs-on: ubuntu-latest
    env:
      OTEL_COLLECTOR_INGEST_TOKEN: ci-contract-validation-token
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve backend safety ref
        id: backend-ref
        env:
          CROSS_REPO_TOKEN: ${{ secrets.BP175_CROSS_REPO_READ_TOKEN }}
          REQUESTED_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          repository=hnguyen283/llm-council
          available_refs=$(GH_TOKEN="$CROSS_REPO_TOKEN" gh api --paginate "repos/${repository}/branches?per_page=100" --jq '.[].name' 2>/dev/null || true)
          if printf '%s\n' "$available_refs" | grep -Fqx "$REQUESTED_REF"; then
            echo "ref=${REQUESTED_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hnguyen283/llm-council
          ref: ${{ steps.backend-ref.outputs.ref }}
          path: .ci/safety/llm-council
          token: ${{ secrets.BP175_CROSS_REPO_READ_TOKEN }}
          persist-credentials: false
      - name: Resolve admin safety ref
        id: admin-ref
        env:
          CROSS_REPO_TOKEN: ${{ secrets.BP175_CROSS_REPO_READ_TOKEN }}
          REQUESTED_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          repository=hnguyen283/llm-council-admin-ui
          available_refs=$(GH_TOKEN="$CROSS_REPO_TOKEN" gh api --paginate "repos/${repository}/branches?per_page=100" --jq '.[].name' 2>/dev/null || true)
          if printf '%s\n' "$available_refs" | grep -Fqx "$REQUESTED_REF"; then
            echo "ref=${REQUESTED_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hnguyen283/llm-council-admin-ui
          ref: ${{ steps.admin-ref.outputs.ref }}
          path: .ci/safety/llm-council-admin-ui
          token: ${{ secrets.BP175_CROSS_REPO_READ_TOKEN }}
          persist-credentials: false
      - name: Run the portable CI contract
        env:
          BP175_BACKEND_ROOT: ${{ github.workspace }}/.ci/safety/llm-council
          BP175_INFRA_ROOT: ${{ github.workspace }}
          BP175_ADMIN_ROOT: ${{ github.workspace }}/.ci/safety/llm-council-admin-ui
        run: bash ci/run.sh all
      - name: Publish sanitized CI evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-evidence-contract
          path: .ci/evidence
          if-no-files-found: error
  render-options:
    runs-on: ubuntu-latest
    env:
      OTEL_COLLECTOR_INGEST_TOKEN: ci-contract-validation-token
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Render all Compose options through the portable contract
        run: bash ci/run.sh validate
      - name: Publish sanitized CI evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-evidence-options
          path: .ci/evidence
          if-no-files-found: error