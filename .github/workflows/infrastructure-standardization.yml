name: infrastructure-standardization

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  ci-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hnguyen283/llm-council
          ref: ${{ github.head_ref || github.ref_name }}
          path: .ci/safety/llm-council
          token: ${{ secrets.BP175_CROSS_REPO_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: hnguyen283/llm-council-admin-ui
          ref: ${{ github.head_ref || github.ref_name }}
          path: .ci/safety/llm-council-admin-ui
          token: ${{ secrets.BP175_CROSS_REPO_READ_TOKEN }}
          persist-credentials: false
      - name: Run the portable CI contract
        env:
          BP175_BACKEND_ROOT: ${{ github.workspace }}/.ci/safety/llm-council
          BP175_INFRA_ROOT: ${{ github.workspace }}
          BP175_ADMIN_ROOT: ${{ github.workspace }}/.ci/safety/llm-council-admin-ui
        run: bash ci/run.sh all
      - name: Publish sanitized CI evidence
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-contract
          path: .ci/evidence
          if-no-files-found: error
  render-options:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        option:
          - dev-full-http
          - dev-full-https
          - dev-local-ai
          - prod-full-local-http
          - prod-full-local-https
          - prod-full-local-https-tunnel
          - prod-full-local-observability
          - prod-lite-local
    steps:
      - uses: actions/checkout@v4
      - name: Render Compose option through portable contract
        run: bash ci/run.sh validate
      - name: Publish sanitized CI evidence
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ matrix.option }}
          path: .ci/evidence
          if-no-files-found: error
